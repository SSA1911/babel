name: Babel
options:
  bundleIdPrefix: com.babel
  deploymentTarget:
    iOS: "17.4"
configs:
  Debug: debug
  Release: release
targets:
  Babel:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Babel
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Babel needs microphone access to transcribe and translate your conversation live."
        NSSpeechRecognitionUsageDescription: "Babel uses on-device speech recognition to transcribe your conversation live."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babel.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
